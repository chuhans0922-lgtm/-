    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif TC"', '"Noto Serif SC"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              mahjong: {
                green: '#0f3a28',
                greenLight: '#1b5e43',

    <style>

        background-color: #0d2b1f;
        background-image: radial-gradient(#144532 15%, transparent 16%), radial-gradient(#144532 15%, transparent 16%);

        background-position: 0 0, 10px 10px;
